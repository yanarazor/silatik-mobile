name: silatik_mobile
description: Aplikasi SILATIK user side untuk registrasi LATIK
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  reactive_forms: ^17.0.1
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  file_picker: ^8.1.2
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.5
  open_filex: ^4.7.0
  flutter_local_notifications: ^17.2.3
  lottie: ^3.3.3
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  intl: ^0.20.3
  get: ^4.7.3
  shimmer: ^3.0.0
  path: ^1.9.1
  go_router: ^17.2.3
  url_launcher: ^6.3.0
  flutter_widget_from_html: ^0.15.2
  syncfusion_flutter_pdfviewer: ^33.2.13
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - .env
